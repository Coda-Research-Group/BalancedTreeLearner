name: batl-gpu-cu128
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.26,<2
  - scipy>=1.13,<2
  - scikit-learn>=1.5,<2
  - h5py>=3.11,<4
  - pyyaml>=6.0,<7
  - tqdm>=4.66,<5
  - pytest>=9.0,<10
  - pytest-cov>=7.0,<8
  - ruff>=0.15,<1
  - pyright>=1.1,<2
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.7,<3
      - faiss-gpu>=1.10
