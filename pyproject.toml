[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batl"
version = "0.0.1"
description = "Balanced Tree Learner: transformer-based k-ary tree index for high-dimensional retrieval"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jozef Šprlák", email = "jozef.sprlak1@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "torch>=2.5,<3",
    "numpy>=1.26,<2",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "faiss-cpu>=1.9,<2",
    "h5py>=3.11,<4",
    "pyyaml>=6.0,<7",
    "tqdm>=4.66,<5",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<1",
    "pyright>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["batl*", "experiments*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--cov=batl --cov-report=term-missing --cov-fail-under=85 --cov-config=pyproject.toml"

[tool.coverage.run]
omit = ["./build.py", "./search.py", "./merge_index.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings (trailing whitespace etc.)
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line too long — formatter handles this, not linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"experiments/*" = ["B"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Darwin"
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"
