experiment:
  name: yandexti100m_full_t4
  seed: 42
  output_dir: results/yandexti100m_full_t4
  tree_assignment_order: confidence
dataset:
  name: yandexti
  path: data/yandexti100m
  base_path: data/yandexti100m/base.fbin
  query_path: data/yandexti100m/query.fbin
  ground_truth_path: data/yandexti100m/groundtruth.ibin
  source_name: YANDEXTI100M
  source_url: https://research.yandex.com/datasets/text-to-image-dataset-for-billion-scale-similarity-search
  # YandexTI's native similarity is inner product (raw dot product, not
  # cosine -- base/query embeddings come from different encoders with
  # different norm distributions). This uses the raw-dot-product path added
  # to batl/distance.py, batl/rerank.py, batl/search.py, and
  # batl/neighbor_search.py (IndexFlatIP on unnormalized vectors, distinct
  # from the angular/cosine path which L2-normalizes first).
  metric: inner_product
  split: train
  subset_size: 100000000
  storage_mode: memmap
model:
  branching_factor: 256
  tree_height: 2
  embedding_dim: 200
  encoder_hidden: 1024
  embed_dim: 256
  num_decoder_layers: 1
  num_heads: 8
  ff_dim: 1024
  dropout: 0.1
  alpha: 1.0
  num_trees: 4
training:
  batch_size: 16384
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  alternating_interval: 2
  convergence_patience: 2
  convergence_min_delta: 0.005
  top_k_neighbors: 100
  neighbor_search_subset: 1000000
  neighbor_search_mode: random_subset
  neighbor_search_chunk_size: 1000000
  neighbor_search_backend: faiss_gpu
  tree_update_cache_embeddings: false
  device: cuda
evaluation:
  recall_at: [10]
  num_queries: 100000
  beam_size: 100
  num_leaves: [10, 40, 80, 100]
  rerank_backend: numpy_cpu
