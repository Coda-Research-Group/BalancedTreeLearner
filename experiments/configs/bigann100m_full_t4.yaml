experiment:
  name: bigann100m_full_t4
  seed: 42
  output_dir: results/bigann100m_full_t4
  tree_assignment_order: confidence
dataset:
  name: bigann
  path: data/bigann100m
  base_path: data/bigann100m/base.u8bin
  query_path: data/bigann100m/query.u8bin
  ground_truth_path: data/bigann100m/groundtruth.ivecs
  source_name: BIGANN100M
  source_url: https://big-ann-benchmarks.com/neurips21.html
  metric: euclidean
  split: train
  subset_size: 100000000
  storage_mode: memmap
model:
  branching_factor: 256
  tree_height: 2
  embedding_dim: 128
  encoder_hidden: 1024
  embed_dim: 256
  num_decoder_layers: 1
  num_heads: 8
  ff_dim: 1024
  dropout: 0.1
  alpha: 1.0
  num_trees: 4
training:
  batch_size: 16384
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  alternating_interval: 2
  convergence_patience: 2
  convergence_min_delta: 0.005
  top_k_neighbors: 100
  neighbor_search_subset: 1000000
  neighbor_search_mode: random_subset
  neighbor_search_chunk_size: 1000000
  neighbor_search_backend: faiss_gpu
  tree_update_cache_embeddings: false
  device: cuda
evaluation:
  recall_at: [10]
  num_queries: 10000
  beam_size: 100
  num_leaves: [10, 40, 80, 100]
  rerank_backend: numpy_cpu
